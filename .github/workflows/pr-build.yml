name: PR Build

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build server and client
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore .NET
        run: dotnet restore BudgetApp/BudgetApp.slnx

      - name: Restore EF tooling
        run: dotnet tool restore

      - name: Verify EF tooling
        run: dotnet tool run dotnet-ef --version

      - name: Build .NET
        run: dotnet build BudgetApp/BudgetApp.slnx --configuration Release --no-restore

      - name: Verify EF migration discovery without a database
        env:
          DOTNET_ENVIRONMENT: Testing
          ASPNETCORE_ENVIRONMENT: Testing
          ConnectionStrings__BudgetApp: 'Server=127.0.0.1,1;Database=BudgetAppDependencySmoke;Integrated Security=True;Connect Timeout=1;'
          Email__DeliveryMode: Disabled
        run: dotnet tool run dotnet-ef migrations list --no-connect --no-build --configuration Release --project BudgetApp/BudgetApp.Infrastructure --startup-project BudgetApp/BudgetApp.Server

      - name: Test .NET
        run: dotnet test BudgetApp/BudgetApp.Tests/BudgetApp.Tests.csproj --configuration Release --no-build

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: BudgetApp/budgetapp.client/package-lock.json

      - name: Install client dependencies
        working-directory: BudgetApp/budgetapp.client
        run: npm ci

      - name: Audit client and build dependencies
        working-directory: BudgetApp/budgetapp.client
        run: npm audit --audit-level=high

      - name: Lint client
        working-directory: BudgetApp/budgetapp.client
        run: npm run lint

      - name: Build client
        working-directory: BudgetApp/budgetapp.client
        run: npm run build

      - name: Test client navigation and forms
        working-directory: BudgetApp/budgetapp.client
        run: npm test
